name: Daily Casting Alert
on:
  schedule:
    - cron: '0 13 * * *'  # 10:00 BRT (13:00 UTC)
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Forçar envio mesmo sem novas oportunidades'
        required: false
        default: 'false'
        type: boolean
permissions:
  contents: write
jobs:
  casting-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 python-dotenv feedparser
      - name: Send daily casting alert
        env:
          MONITOR_RECIPIENT: huddsong@gmail.com
          GMAIL_SENDER: huddsong@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_send }}" = "true" ]; then
            ARGS="--force-send"
          fi
          cd scripts && python alerta_casting.py $ARGS
      - name: Commit updated seen history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/casting_seen.json data/feeds_descobertos.json data/rss_check_timestamp.txt || true
          git diff --cached --quiet || git commit -m "chore: update casting data [skip ci]"
          git pull --rebase origin main || true
          git push || true
      - name: Notify on failure
        if: failure()
        run: |
          echo "Casting alert job failed at $(date)"
          exit 1
