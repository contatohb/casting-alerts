name: Daily Casting Alert

on:
  schedule:
    - cron: '0 13 * * *'  # 10:00 BRT (13:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  casting-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 python-dotenv

      - name: Send daily casting alert
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: cd scripts && python alerta_casting.py
        env:
          MONITOR_RECIPIENT: huddsonviana@gmail.com
          GMAIL_SENDER: huddsonviana@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit updated seen history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/casting_seen.json || true
          git diff --cached --quiet || git commit -m "chore: update casting seen history [skip ci]"
          git pull --rebase origin main || true
          git push || true

      - name: Notify on failure
        if: failure()
        run: |
          echo "Casting alert job failed at $(date)"
          exit 1
