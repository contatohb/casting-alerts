name: Daily Casting Alert

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 BRT (13:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  casting-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Send daily casting alert
        env:
          MONITOR_RECIPIENT: huddsong@gmail.com
        run: |
          python scripts/alerta_casting.py

      - name: Notify on failure
        if: failure()
        env:
          FAILURE_MESSAGE: "Daily casting alert failed"
        run: |
          echo "Casting alert job failed at $(date)"
          exit 1
